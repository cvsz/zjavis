name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis
          POSTGRES_DB: jarvis
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate repository structure and Markdown links
        run: python3 scripts/validate_repo.py

      - name: Exercise startup bootstrap tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
        env:
          JARVIS_DATABASE_URL: postgresql+psycopg://jarvis:jarvis@localhost:5432/jarvis
          JARVIS_APP_SECRET: ci-secret-key-for-testing-only

      - name: Check for common secret file names
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|id_rsa|id_ed25519|.*\.pem|.*\.key)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret-bearing file is tracked.'
            exit 1
          fi

      - name: Validate rollout shell syntax
        run: bash -n scripts/rollout-independent-review.sh

      - name: Validate YAML syntax
        shell: bash
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}").each { |f| YAML.load_file(f); puts "ok #{f}" }'
