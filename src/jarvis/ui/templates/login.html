<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — Sign In</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0b1021; color: #e8eaf2; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { width: 100%; max-width: 400px; padding: 40px; border: 1px solid #1f2a44; border-radius: 12px; background: #111827; box-shadow: 0 24px 48px -12px rgba(0,0,0,0.6); }
  h1 { margin: 0 0 8px; font-size: 1.5rem; letter-spacing: -0.02em; color: #60a5fa; }
  .tagline { font-size: 0.875rem; color: #94a3b8; margin-bottom: 24px; }
  label { display: block; font-size: 0.875rem; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
  input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; font-size: 1rem; margin-bottom: 14px; outline: none; }
  input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96,165,250,0.2); }
  button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #60a5fa; color: #0b1021; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 6px; }
  button:hover { background: #93c5fd; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: #f87171; font-size: 0.875rem; margin-bottom: 14px; min-height: 1.25em; }
  .footer { margin-top: 20px; font-size: 0.8rem; color: #64748b; text-align: center; }
  .footer a { color: #60a5fa; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1>JARVIS</h1>
  <p class="tagline">Personal AI Operating System — operator sign in</p>
  <div id="error" class="error" aria-live="polite"></div>
  <form id="loginForm" novalidate>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autocomplete="username" autofocus placeholder="e.g. alice">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
    <button id="submitBtn" type="submit">Sign in</button>
  </form>
  <div class="footer">JARVIS v0.1.0 &middot; <a href="/health">Health</a></div>
</div>
<script>
(function () {
  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('error');
  const btn = document.getElementById('submitBtn');
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: form.username.value,
          user_pwd: form.password.value,
        }),
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(text || 'Login failed');
      }
      const data = await res.json();
      localStorage.setItem('jarvis_token', data.access_token);
      localStorage.setItem('jarvis_user', form.username.value);
      window.location.replace('/dashboard');
    } catch (err) {
      errorEl.textContent = err.message || 'Login failed. Try again.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
})();
</script>
</body>
</html>
