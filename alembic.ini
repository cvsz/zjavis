# Alembic configuration for JARVIS database migrations

[alembic]
# path to migration scripts
script_location = alembic

# database URL (overridden by env at runtime)
sqlalchemy.url = ${JARVIS_DATABASE_URL}

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# version location
version_locations = %(here)s/alembic/versions

# version table name
version_table = alembic_version

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
timezone = UTC

# max length of characters to apply to the
# "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
revision_environment = false

# set to 'true' to allow .py and .xml files to be
# rendered by editors even if they're not used as
# a migration source
# rewrite_comments = false

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use this if you do not have black installed,
# uncomment this and adjust as needed
#hooks = black
#black.type = console_scripts
#black.entrypoint = black
#black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
