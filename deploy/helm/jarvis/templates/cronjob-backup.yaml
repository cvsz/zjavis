{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "jarvis.fullname" . }}-backup
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "jarvis.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.backup.imagePullPolicy }}
              command:
                - python3
                - scripts/backup_db.py
                - --output
                - /backups/jarvis-db-$(date +\%Y\%m\%d-\%H\%M\%S).dump
              envFrom:
                - configMapRef:
                    name: {{ include "jarvis.fullname" . }}-config
                - secretRef:
                    name: {{ include "jarvis.fullname" . }}-secrets
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: PYTHONPATH
                  value: "/app/src"
                - name: JARVIS_BACKUP_DIR
                  value: "/backups"
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              emptyDir: {}
{{- end }}
